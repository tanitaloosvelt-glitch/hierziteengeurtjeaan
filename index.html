<!DOCTYPE html><html lang="nl-BE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hier hangt een geurtje aan…</title>
<style>
:root{--bg:#e9f7f5;--cd:#fff;--tx:#1c2a33;--mu:#566872;--pr:#0a8f7e;--pt:#fff;--ok:#1f8a45;--okb:#dcf4e3;--ko:#c93a3a;--kob:#fde3e3;--bd:#bfdcd7;--hi:#fff2c2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1f1e;--cd:#172b29;--tx:#e6f2ef;--mu:#9ab3ae;--pr:#3cc9b3;--pt:#06231f;--ok:#6fdc8f;--okb:#1b3a28;--ko:#ff8c8c;--kob:#412123;--bd:#2c4743;--hi:#4a4220}}
:root[data-theme="dark"]{--bg:#0e1f1e;--cd:#172b29;--tx:#e6f2ef;--mu:#9ab3ae;--pr:#3cc9b3;--pt:#06231f;--ok:#6fdc8f;--okb:#1b3a28;--ko:#ff8c8c;--kob:#412123;--bd:#2c4743;--hi:#4a4220}
*,*:before,*:after{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 "Trebuchet MS","Avenir Next",Verdana,sans-serif}
header{position:relative;overflow:hidden;background:var(--pr);color:var(--pt);padding:18px 16px 14px;text-align:center}
h1{margin:0;font-size:clamp(1.5rem,5vw,2.3rem);letter-spacing:.5px}header p{margin:2px 0 8px}
.puffs span{position:absolute;bottom:-20px;font-size:26px;opacity:.55;animation:up 6s linear infinite}
@keyframes up{to{transform:translateY(-140px) translateX(18px) rotate(25deg);opacity:0}}
.bar{height:10px;background:rgba(255,255,255,.35);border-radius:9px;max-width:520px;margin:6px auto 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#ffd23f;border-radius:9px;transition:width .6s}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;max-width:900px;margin:auto}
nav button{flex:none;border:2px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:20px;padding:6px 12px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:700}
main{max-width:900px;margin:auto;padding:4px 12px 40px}
.pg{animation:in .4s}@keyframes in{from{opacity:0;transform:translateY(10px)}}
.pg>h2{font-size:1.6rem;margin:.4em 0 .2em}
.pics{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin:8px 0}
.pic{height:120px;max-width:44%;object-fit:contain;background:#fff;border-radius:14px;padding:4px;transition:transform .3s}.pic:hover{transform:rotate(-4deg) scale(1.08)}
.task{background:var(--cd);border:2px solid var(--bd);border-radius:16px;padding:14px;margin:16px 0}.task h3{margin:0 0 8px;font-size:1.05rem}
.task.done{border-color:var(--ok)}.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.opts{display:grid;gap:8px}.opt,.tf{font:inherit;color:var(--tx);background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:9px 12px;text-align:left;cursor:pointer}
.opt.on,.tf.on{border-color:var(--pr);background:var(--hi);font-weight:700}
.good{border-color:var(--ok)!important;background:var(--okb)!important}.bad{border-color:var(--ko)!important;background:var(--kob)!important;animation:sh .4s}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 8px;border:2px solid transparent;border-radius:12px}.row>span{flex:1 1 220px}
.row small{flex-basis:100%;color:var(--ko)}.tf{text-align:center;min-width:70px}.tf.g.on{background:#2fb35a;color:#fff}.tf.r.on{background:#e04f4f;color:#fff}
select{font:inherit;padding:6px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);max-width:100%}
.fill{line-height:2.4}
.drop{min-height:46px;border:2px dashed var(--bd);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}.sl{text-align:center;font-size:.92rem;margin-bottom:4px}.sl img{height:90px;background:#fff;border-radius:10px;display:block;margin:0 auto 4px;max-width:100%;object-fit:contain}
.chip{background:var(--pr);color:var(--pt);padding:6px 12px;border-radius:18px;cursor:grab;touch-action:none;user-select:none;font-size:.95rem}
.chip.pick{outline:3px solid #ffd23f}.chip.lift{opacity:.3}.ghost{position:fixed;z-index:9;pointer-events:none;transform:rotate(-4deg) scale(1.08);box-shadow:0 8px 18px #0005}
.chip.good{color:var(--tx)}.chip.bad{color:var(--tx)}
.btn{margin-top:10px;background:var(--pr);color:var(--pt);border:0;border-radius:22px;padding:9px 20px;font:inherit;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(1.1)}
.fb{margin:8px 0 0;font-weight:700}
.q{margin:4px;border:2px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:18px;padding:7px 12px;font:inherit;cursor:pointer;transition:transform .2s}.q.on{background:var(--hi);border-color:var(--pr);transform:scale(1.06) rotate(-1.5deg)}
.foot{display:flex;justify-content:space-between;margin-top:18px}
.conf{position:fixed;z-index:20;font-size:22px;pointer-events:none;animation:cf 1s ease-out forwards}@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
.big{text-align:center;font-size:4rem;animation:bn 1.2s infinite}@keyframes bn{50%{transform:translateY(-14px)}}
:focus-visible{outline:3px solid #ffd23f;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
